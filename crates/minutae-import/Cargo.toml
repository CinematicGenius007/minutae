[package]
name = "minutae-import"
description = "Import meetings and dictations from older Minutae apps (Swift, Tauri v1) into the v4 store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
minutae-core.workspace = true
minutae-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
# Legacy databases are snapshotted into a temp dir before reading, so the old files are never written.
tempfile = "3"
