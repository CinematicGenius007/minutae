[package]
name = "minutae-dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
minutae-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
# `image-data`: images on the clipboard are saved and restored around a paste (see insert.rs).
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
# Default feature `x11rb` is pure Rust, so Linux builds need no libxdo.
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
# XDG GlobalShortcuts portal (Wayland). zbus is pure Rust: no new system packages.
ashpd = { version = "=0.14.1", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true

[[example]]
name = "insert"
