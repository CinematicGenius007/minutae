[package]
name = "minutae-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
minutae-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
cpal = "0.18"
hound = "3.5"
# Lock-free SPSC ring between the realtime callback and the writer (no allocation on the audio thread).
rtrb = "0.4"
tokio = { workspace = true }

# macOS: per-app system audio. Core Audio process taps (14.4+) and the ScreenCaptureKit
# audio fallback (13.0 - 14.3).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSUUID", "NSValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "libc", "dispatch2", "objc2-core-media", "objc2-core-foundation"] }

# Linux: PulseAudio host (pure Rust client; works on PipeWire via pipewire-pulse)
# so the default sink's `.monitor` source can be recorded.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[dev-dependencies]
serde_json.workspace = true

[features]
# Native PipeWire host on Linux (needs libpipewire-0.3 headers + clang to build).
pipewire = ["cpal/pipewire"]
