[package]
name = "minutae-diarize"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["static"]
# sherpa-onnx + onnxruntime linked statically from the prebuilt k2-fsa archive (default).
static = ["sherpa-onnx/static"]
# Link sherpa-onnx (and onnxruntime) as shared libraries instead. Use with `--no-default-features`.
shared = ["sherpa-onnx/shared"]

[dependencies]
sha2 = "0.10"
minutae-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
hound = "3.5"
sherpa-onnx = { version = "2.0.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
bzip2 = "0.6"
tar = "0.4"

[dev-dependencies]
minutae-asr.workspace = true
tempfile = "3"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
