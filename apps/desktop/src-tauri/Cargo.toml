[package]
name = "minutae-desktop"
description = "Minutae desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "minutae_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

minutae-core.workspace = true
minutae-store.workspace = true
minutae-jobs.workspace = true
minutae-audio.workspace = true
minutae-detect.workspace = true
minutae-asr.workspace = true
minutae-diarize.workspace = true
minutae-llm.workspace = true
minutae-dictation.workspace = true
minutae-search.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
arboard = { version = "3.7", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
