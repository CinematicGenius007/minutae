# Minutae v4 release: builds every platform and attaches the installers to a DRAFT GitHub
# Release (publish it by hand). Owner setup, secrets and the release checklist: docs/RELEASE.md.
#
# Free by design: runs with no secrets at all, and every secret below is free to create.
#   macOS signing      APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD + APPLE_SIGNING_IDENTITY.
#                      The plan is the free self-signed certificate from
#                      scripts/macos-self-signed-cert.sh: a stable identity, so macOS keeps
#                      mic / system-audio / accessibility permissions across updates. Without
#                      it builds are ad-hoc signed and users re-grant permissions per update.
#   In-app updater     TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) and the public key, either in
#                      tauri.conf.json `plugins.updater.pubkey` or repo variable TAURI_UPDATER_PUBKEY
#   Optional, paid, not planned (kept so they can be switched on later):
#   macOS notarization APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID, or
#                      APPLE_API_ISSUER + APPLE_API_KEY + APPLE_API_PRIVATE_KEY (.p8 contents)
#   Windows signing    AZURE_CLIENT_ID + AZURE_CLIENT_SECRET + AZURE_TENANT_ID and repo variables
#                      AZURE_SIGNING_ENDPOINT / AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE
#
# Besides the installers it uploads a Windows portable zip, the Scoop manifest
# (minutae.json), the Homebrew cask (minutae.rb) and SHA256SUMS.txt. Binaries are compiled with MINUTAE_CHANNEL=release so
# the app knows it is a release copy (see apps/desktop/src-tauri/src/updater.rs).
# Secrets are exported only when non-empty: an empty APPLE_CERTIFICATE would make Tauri try
# (and fail) to import a certificate.
#
# Toolchain setup mirrors v4.yml (static CRT on Windows via .cargo/config.toml, LIBCLANG_PATH,
# Linux -dev packages, Bun 1.4.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.0 (created at the selected ref if it doesn't exist)"
        required: true

# Read-only by default; only the jobs that upload get write access (per job, below).
# Every action is pinned to a commit SHA so a moved tag can't run new code next to the
# signing keys.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Tag matches Cargo.toml version
        id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "::error::Tag must look like v1.2.3 (got $TAG)"; exit 1 ;; esac
          VERSION="${TAG#v}"
          bun scripts/version.ts --check "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Native Intel runner: cross-building whisper.cpp + sherpa-onnx's prebuilt static
          # archive for x86_64 from arm64 is not worth the risk.
          - name: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: ""
            args: ""
          - name: Linux
            os: ubuntu-22.04
            target: ""
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MINUTAE_CHANNEL: release

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config patchelf file xdg-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev libxdo-dev libdbus-1-dev libssl-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxi-dev libxtst-dev

      - name: macOS tools
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          # bindgen (whisper-rs-sys) needs libclang; the runner ships LLVM here.
          if (Test-Path "C:\Program Files\LLVM\bin") { "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Registry only, like v4.yml: restored target/ dirs carried stale native build state.
          key: release-registry-only
          cache-targets: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Windows signing tool
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: bash
        env:
          # Only whether the secret exists; the secret itself reaches nothing but the build step.
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: if [ "$HAS_AZURE" = true ]; then cargo install trusted-signing-cli --locked; fi

      - name: Release config overlay
        shell: bash
        env:
          HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          bun scripts/release-config.ts "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.release.conf.json"
          cat apps/desktop/src-tauri/tauri.release.conf.json

      # Only non-empty secrets reach the environment, so a missing group means "skip that
      # step" (unsigned / not notarized), never "fail on an empty value". This runs right
      # before the build (nothing else sees the keys) and "Clear signing environment" wipes
      # them right after.
      - name: Signing environment (only secrets that exist)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          export_if_set() {
            local name="$1" value="${!1}"
            [ -n "$value" ] || return 0
            local eof
            eof="EOF_$(openssl rand -hex 8)"
            { echo "$name<<$eof"; printf '%s\n' "$value"; echo "$eof"; } >> "$GITHUB_ENV"
          }
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do export_if_set "$v"; done

          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do export_if_set "$v"; done
              echo "macOS: signing with the configured identity"
              if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
                key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
                printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
                export_if_set APPLE_API_ISSUER; export_if_set APPLE_API_KEY
                echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
                echo "macOS: notarizing with an App Store Connect API key"
              elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do export_if_set "$v"; done
                echo "macOS: notarizing with an Apple ID"
              else
                echo "macOS: not notarized (expected with the free self-signed certificate)"
              fi
            else
              # Ad-hoc signature: no Developer ID, but the bundle is consistently signed, so
              # Gatekeeper offers "Open Anyway" instead of calling the app damaged.
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              echo "::warning::macOS build is ad-hoc signed: users re-grant permissions after this update. Configure the signing secrets with scripts/release-setup.sh."
              printf '%s\n' "- **Stable macOS signing identity missing.** This build is ad-hoc signed. macOS will ask for microphone, system audio and Accessibility permissions again after an update. Set the signing secrets with \`scripts/release-setup.sh\` before your first public release." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do export_if_set "$v"; done
          fi

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Minutae ${{ needs.prepare.outputs.version }}
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            ## What's new

            _Write the highlights here before publishing._

            ## Install

            **macOS and Linux**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.prepare.outputs.tag }}/scripts/install.sh | sh -s -- --version ${{ needs.prepare.outputs.version }}
            ```

            **Windows** (latest stable via [Scoop](https://scoop.sh))

            ```powershell
            scoop install https://github.com/${{ github.repository }}/releases/latest/download/minutae.json
            ```

            Without Scoop, use the PowerShell installer for the latest stable release:

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.prepare.outputs.tag }}/scripts/install.ps1 | iex
            ```

            Install guide: [docs/install](https://github.com/${{ github.repository }}/tree/${{ needs.prepare.outputs.tag }}/docs/install). AI agents: read [docs/agents/INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ needs.prepare.outputs.tag }}/docs/agents/INSTALL.md).

            ## Files

            | System | File |
            | --- | --- |
            | macOS, Apple silicon | `Minutae_${{ needs.prepare.outputs.version }}_aarch64.dmg` |
            | macOS, Intel | `Minutae_${{ needs.prepare.outputs.version }}_x64.dmg` |
            | Windows | `Minutae_${{ needs.prepare.outputs.version }}_x64-portable.zip` (Scoop), `_x64-setup.exe` or `.msi` |
            | Linux | `.AppImage`, `.deb` (Debian/Ubuntu) or `.rpm` (Fedora) |

            Checksums: `SHA256SUMS.txt`.

            For a manually downloaded macOS app, after the first blocked launch go to System Settings → Privacy & Security → **Open Anyway**. Windows 11 Smart App Control can block unsigned installers and apps, including when installed from PowerShell or Scoop.

      - name: Clear signing environment
        if: always()
        shell: bash
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                   APPLE_API_KEY APPLE_API_ISSUER AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Windows portable zip (for Scoop)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $exe = "target/release/minutae-desktop.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/portable"
          Copy-Item $exe "$dir/Minutae.exe"
          $zip = "$env:RUNNER_TEMP/Minutae_${env:VERSION}_x64-portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          gh release upload $env:TAG $zip --repo $env:GITHUB_REPOSITORY --clobber

  checksums:
    name: Checksums, Scoop manifest and Homebrew cask
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance (attestation) below
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Checksums and package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.dmg" --pattern "*.exe" --pattern "*.msi" --pattern "*-portable.zip" \
            --pattern "*.AppImage" --pattern "*.deb" --pattern "*.rpm"
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"
          ZIP="Minutae_${VERSION}_x64-portable.zip"
          HASH="$(sha256sum -- "$ZIP" | cut -d' ' -f1)"
          bun "$GITHUB_WORKSPACE/scripts/scoop-manifest.ts" "$VERSION" "$HASH" minutae.json
          ARM_HASH="$(sha256sum -- "Minutae_${VERSION}_aarch64.dmg" | cut -d' ' -f1)"
          INTEL_HASH="$(sha256sum -- "Minutae_${VERSION}_x64.dmg" | cut -d' ' -f1)"
          bun "$GITHUB_WORKSPACE/scripts/homebrew-cask.ts" "$VERSION" "$ARM_HASH" "$INTEL_HASH" minutae.rb
          # Install and update-check scripts ride along with every release, pinned to it.
          cp "$GITHUB_WORKSPACE"/scripts/{check-update,install}.{sh,ps1} .
          gh release upload "$TAG" SHA256SUMS.txt minutae.json minutae.rb install.sh install.ps1 check-update.sh check-update.ps1 \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Free on public repos. Proves each file was built by this workflow from this repo, so a
      # file swapped on the release page fails `gh attestation verify` (install.sh runs it
      # when gh is signed in). SHA256SUMS.txt alone only catches corrupt downloads.
      - name: Build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS.txt
