# Minutae v4 (Tauri 2 + Rust workspace + Bun). The Swift app and `legacy/` keep their own
# workflows (ci.yml / release.yml); this one only covers crates/*, apps/desktop and libs/ui.
#
# Windows C runtime: sherpa-onnx's prebuilt static archive (minutae-diarize, feature `static`)
# is built with /MT (static CRT). whisper.cpp (whisper-rs-sys, via the `cmake` crate) and every
# `cc`-built C dependency follow Rust's `crt-static` target feature, so the whole workspace is
# linked with the static CRT: `.cargo/config.toml` sets `-C target-feature=+crt-static` for
# the MSVC targets (no VC++ redistributable needed at install time). RUSTFLAGS is not set here
# because it would override that file.
name: v4

on:
  push:
    branches: [v4-tauri]
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".cargo/**"
      - ".github/workflows/v4.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Build the .app bundle on macOS (no signing in CI).
            tauri_args: --debug --bundles app
          - name: Windows
            os: windows-latest
            tauri_args: --debug --no-bundle
          - name: Linux
            os: ubuntu-22.04
            tauri_args: --debug --no-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config patchelf file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev libxdo-dev libdbus-1-dev libssl-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxi-dev libxtst-dev

      - name: macOS tools
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          # bindgen (whisper-rs-sys) needs libclang; the runner ships LLVM here.
          if (Test-Path "C:\Program Files\LLVM\bin") { "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Also keeps sherpa-onnx's downloaded prebuilt archive (it lives under target/).
          key: v4
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: UI library tests
        run: bun --cwd libs/ui test

      - name: Desktop typecheck
        run: bun --cwd apps/desktop typecheck

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tauri build
        working-directory: apps/desktop
        run: bun run tauri build ${{ matrix.tauri_args }}

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: minutae-macos-debug-app
          path: target/debug/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7
