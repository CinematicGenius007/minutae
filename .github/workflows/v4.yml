# Minutae v4 (Tauri 2 + Rust workspace + Bun). The Swift app and `legacy/` keep their own
# workflows (ci.yml / release-legacy.yml); this one only covers crates/*, apps/desktop and libs/ui.
# v4 releases: release.yml (tag `v*`).
#
# Windows C runtime: everything is linked with the static CRT (/MT, no VC++ redistributable
# needed at install time). sherpa-onnx's prebuilt static archive (minutae-diarize, feature
# `static`, the only feature set built here) is /MT, so `.cargo/config.toml` sets
# `-C target-feature=+crt-static` for the MSVC targets, which `cc`-built C code follows.
# whisper.cpp (whisper-rs-sys, CMake) does not follow it in debug builds, so the same file's
# `[env]` section pins CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded (+ CMP0091=NEW); whisper-rs-sys
# forwards CMAKE_* env vars to CMake as defines. RUSTFLAGS is not set here because it would
# override the config file's rustflags.
name: v4

on:
  # Branch pushes are covered by pull_request; push only runs for main (after merge).
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".cargo/**"
      - ".github/workflows/v4.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".cargo/**"
      - ".github/workflows/v4.yml"
  workflow_dispatch:

concurrency:
  # One run per branch/PR: a newer push cancels the older run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Build the .app bundle on macOS (no signing in CI).
            tauri_args: --debug --bundles app
          - name: Windows
            os: windows-latest
            tauri_args: --debug --no-bundle
          - name: Linux
            os: ubuntu-22.04
            tauri_args: --debug --no-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config patchelf file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev libxdo-dev libdbus-1-dev libssl-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxi-dev libxtst-dev

      - name: macOS tools
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          # bindgen (whisper-rs-sys) needs libclang; the runner ships LLVM here.
          if (Test-Path "C:\Program Files\LLVM\bin") { "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache the cargo registry/git only, not target/. Restored target/ dirs carried
          # stale native build state: sherpa-onnx-sys's build record without its downloaded
          # libs (macOS link error), and whisper.cpp CMake caches pointing at a previous
          # runner image's MSVC path (Windows configure error). Native deps rebuild per run.
          key: v4-registry-only
          cache-targets: false
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: UI library tests
        run: bun --cwd libs/ui test

      - name: Desktop typecheck
        run: bun --cwd apps/desktop typecheck

      # install.sh / check-update.sh / check-update.ps1 ship to users; keep them parseable.
      - name: Install scripts (shellcheck)
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/check-update.sh scripts/macos-self-signed-cert.sh

      - name: Install scripts (PowerShell parse + version compare)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/check-update.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          # No release may exist yet: 0 / 10 / 1 are all valid answers; anything else is a bug.
          pwsh -NoProfile -File scripts/check-update.ps1 -Current 0.0.1 -Json
          if ($LASTEXITCODE -notin 0, 1, 10) { exit 1 }
          exit 0

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tauri build
        working-directory: apps/desktop
        run: bun run tauri build ${{ matrix.tauri_args }}

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: minutae-macos-debug-app
          path: target/debug/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7
